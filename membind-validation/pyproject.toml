[project]
name = "membind-validation"
version = "0.1.0"
description = "MemBind basic validation experiment harness"
requires-python = ">=3.11"
dependencies = [
  "graphiti-core @ git+https://github.com/getzep/graphiti.git@021d3a57d511f21b10adaf7fa923bd5c1fce5e9d",
  "openai>=1.0",
  "httpx>=0.27",
  "neo4j>=5.26",
  "pydantic>=2",
  "pandas>=2",
  "pyarrow>=16",
  "matplotlib>=3.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

